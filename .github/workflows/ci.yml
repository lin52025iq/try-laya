name: Core and Chromium tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --junitxml=test-results.xml
        env:
          RUN_NETWORK_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-python-${{ matrix.python }}
          path: test-results.xml

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap without Python Launcher
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup_windows.ps1 -DemoOnly -SkipBrowserInstall
      - name: Core tests
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest -q -m "not browser and not android and not live_laya"
