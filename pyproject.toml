[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "try-laya"
version = "0.1.0"
description = "Laya-first, human-controlled local agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.10,<3", "playwright>=1.49,<2"
]

[project.optional-dependencies]
laya = ["laya==0.3.18"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
agentctl = "laya_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_runtime = ["static/*", "builtin_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["browser: real Chromium integration", "live_laya: requires installed Laya and downloaded weights", "android: requires an explicitly selected ADB device"]
